name: Build CGConvertor (Mac .app + .pkg)

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

defaults:
  run:
    working-directory: python

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Homebrew ffmpeg include componente GPL (libx264/libx265) — vezi
      # THIRD_PARTY_NOTICES.md pentru detalii despre obligatiile de licenta.
      - name: Install FFmpeg (pentru bundling)
        run: |
          brew install ffmpeg
          mkdir -p ffmpeg
          cp "$(which ffmpeg)" ffmpeg/ffmpeg
          cp "$(which ffprobe)" ffmpeg/ffprobe

      - name: Build .app
        run: pyinstaller build-mac.spec

      - name: Verifica .app rezultat
        run: |
          if [ ! -d "dist/CGConvertor Standalone.app" ]; then
            echo "::error::Build-ul nu a produs CGConvertor Standalone.app"
            exit 1
          fi

      - name: Creeaza .zip
        run: |
          cd dist
          ditto -c -k --sequesterRsrc --keepParent "CGConvertor Standalone.app" "$GITHUB_WORKSPACE/CGConvertor-standalone-mac.zip"

      - name: Creeaza .pkg
        run: |
          mkdir -p pkg_root/Applications
          cp -R "dist/CGConvertor Standalone.app" pkg_root/Applications/
          pkgbuild --root pkg_root \
            --identifier com.gordasgdc.CGConvertor.standalone \
            --version "${GITHUB_REF_NAME#v}" \
            --install-location /Applications \
            "$GITHUB_WORKSPACE/CGConvertor-standalone-mac.pkg"

      - name: Creeaza / actualizeaza Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            CGConvertor-standalone-mac.zip
            CGConvertor-standalone-mac.pkg
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
