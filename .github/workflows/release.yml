name: Release macOS

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extrage versiunea din tag
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build universal (Apple Silicon + Intel), fara code signing
        run: |
          xcodebuild -project CGConvertor.xcodeproj \
            -scheme CGConvertor \
            -configuration Release \
            -derivedDataPath build \
            ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            build

      - name: Verifica arhitecturile din binar
        run: |
          APP_PATH=$(find build/Build/Products/Release -maxdepth 1 -name "*.app")
          BIN_PATH="$APP_PATH/Contents/MacOS/$(basename "$APP_PATH" .app)"
          echo "Arhitecturi gasite:"
          lipo -info "$BIN_PATH" || file "$BIN_PATH"

      - name: Localizeaza .app rezultat
        id: locate
        run: |
          APP_PATH=$(find build/Build/Products/Release -maxdepth 1 -name "*.app")
          if [ -z "$APP_PATH" ]; then
            echo "::error::Nu s-a gasit niciun .app in build/Build/Products/Release"
            exit 1
          fi
          echo "app_path=$APP_PATH" >> "$GITHUB_OUTPUT"
          echo "Gasit: $APP_PATH"

      - name: Creeaza .zip
        run: |
          cd "$(dirname "${{ steps.locate.outputs.app_path }}")"
          ditto -c -k --sequesterRsrc --keepParent \
            "$(basename "${{ steps.locate.outputs.app_path }}")" \
            "$GITHUB_WORKSPACE/CGConvertor-${{ steps.ver.outputs.version }}.zip"

      - name: Creeaza .pkg
        run: |
          mkdir -p pkgroot/Applications
          cp -R "${{ steps.locate.outputs.app_path }}" pkgroot/Applications/
          pkgbuild \
            --root pkgroot \
            --identifier com.gordasgdc.cgconvertor \
            --version "${{ steps.ver.outputs.version }}" \
            --install-location / \
            "CGConvertor-${{ steps.ver.outputs.version }}.pkg"

      - name: Creeaza Release cu ambele fisiere
        uses: softprops/action-gh-release@v2
        with:
          files: |
            CGConvertor-${{ steps.ver.outputs.version }}.zip
            CGConvertor-${{ steps.ver.outputs.version }}.pkg
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
