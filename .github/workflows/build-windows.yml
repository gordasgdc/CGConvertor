name: Build CGConvertor (Windows installer)

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

defaults:
  run:
    working-directory: python

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Build LGPL "essentials" (fara libx264/libx265) — vezi THIRD_PARTY_NOTICES.md.
      # Nu foloseste build-ul "full" (GPL), ca sa evitam obligatiile de redistribuire GPL.
      - name: Download FFmpeg (LGPL essentials)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath .
          $dir = Get-ChildItem -Directory -Filter "ffmpeg-*-essentials_build" | Select-Object -First 1
          New-Item -ItemType Directory -Force -Path ffmpeg
          Copy-Item "$($dir.FullName)\bin\ffmpeg.exe" ffmpeg\
          Copy-Item "$($dir.FullName)\bin\ffprobe.exe" ffmpeg\

      # [2026-09-06] mpv bundle-uit direct in instalator - vezi comentariul
      # din build-windows.spec pentru motiv (elimina bug-ul de permisiuni
      # la descarcarea dinamica in %APPDATA%). Acelasi tag "git-release"
      # (nemarcat "Latest") si acelasi tipar de asset dinamic (numele
      # contine un hash de commit, se schimba la fiecare build al mpv) ca
      # in dependency_manager.py - MPV_ASSET_PATTERN de acolo, duplicat aici
      # intentionat (PowerShell, nu Python).
      - name: Download mpv (standalone player)
        shell: pwsh
        run: |
          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/mpv-player/mpv/releases/tags/git-release" -Headers @{ "User-Agent" = "CGConvertor-CI" }
          $asset = $release.assets | Where-Object { $_.name -match "^mpv-.*-x86_64-pc-windows-msvc\.zip$" } | Select-Object -First 1
          if (-not $asset) { Write-Error "Nu s-a gasit asset-ul mpv (x86_64-msvc) in release-ul git-release."; exit 1 }
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile mpv.zip
          Expand-Archive mpv.zip -DestinationPath mpv_extracted
          New-Item -ItemType Directory -Force -Path mpv
          Copy-Item "mpv_extracted\mpv.exe" mpv\

      - name: Build .exe
        run: pyinstaller build-windows.spec

      - name: Verifica .exe rezultat
        shell: pwsh
        run: |
          if (-not (Test-Path "dist\CGConvertor.exe")) {
            Write-Error "Build-ul nu a produs CGConvertor.exe"
            exit 1
          }

      - name: Sincronizeaza versiunea installer-ului cu config.py
        shell: pwsh
        run: |
          $version = (python -c "from config import APP_VERSION; print(APP_VERSION)").Trim()
          (Get-Content installer.iss) -replace '#define MyAppVersion ".*"', "#define MyAppVersion `"$version`"" | Set-Content installer.iss

      - name: Compileaza instalatorul (Inno Setup — preinstalat pe runner-ul windows-latest)
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - name: Verifica instalatorul rezultat
        shell: pwsh
        run: |
          if (-not (Test-Path "Output\CGConvertorSetup.exe")) {
            Write-Error "Inno Setup nu a produs CGConvertorSetup.exe"
            exit 1
          }

      - name: Redenumeste artefactul
        run: Copy-Item Output\CGConvertorSetup.exe "$env:GITHUB_WORKSPACE\CGConvertor-Windows-Setup.exe"

      # [FIX Regula 29, 2026-09-06] `generate_release_notes: true` ar fi
      # publicat automat, pe un release PUBLIC, un rezumat generat de
      # GitHub din mesajele de commit — riscant pentru acest repo, unde
      # commit-urile sunt scrise ca jurnal tehnic intern (nume, cauze de
      # debugging). Eliminat - actiunea creeaza/actualizeaza acum release-ul
      # FARA note auto-generate (`gh release edit --notes` din sesiunea
      # Claude ramane locul unde se scriu notele publice, curate).
      - name: Creeaza / actualizeaza Release
        uses: softprops/action-gh-release@v2
        with:
          files: CGConvertor-Windows-Setup.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
