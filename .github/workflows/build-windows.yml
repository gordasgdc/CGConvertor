name: Build CGConvertor (Windows installer)

on:
  # Candidat: doar construire + semnare + artefact de workflow. NU creează release, NU atinge
  # manifestele publice, NU înlocuiește asset-uri. Publicarea e un pas separat, cu acord separat.
  # Tag-ul `v*` (macOS, publicat) nu se mută și nu se recreează niciodată.
  push:
    branches: ['win-candidate']   # ramură dedicată: un push aici pornește doar acest build de candidat
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    env:
      # `secrets` nu e permis direct într-un `if:`; trece prin env la nivel de job.
      HAS_WIN_SELFSIGN: ${{ secrets.WIN_SELFSIGN_PFX_BASE64 != '' }}
      FFMPEG_VERSION: '9.0.2'
      EXIFTOOL_VERSION: '13.64'
      EXIFTOOL_SHA256: '72c29c44d1e860eebcaefa71692d979af9858fe9a6d7d791a5e7f1dac77804af'
    steps:
      - uses: actions/checkout@v4

      - name: Versiunea aplicației (sursă unică) și garda tag == versiune
        shell: pwsh
        run: |
          $v = (Select-String -Path windows\CGConvertor.Client\App.xaml.cs -Pattern 'Version\s*=\s*"([0-9.]+)"').Matches[0].Groups[1].Value
          if (-not $v) { Write-Error "Nu găsesc versiunea în App.xaml.cs"; exit 1 }
          "APP_VERSION=$v" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Dependențe incluse (FFmpeg verificat SHA-256 + nucleul gdc-metadata)
        shell: pwsh
        run: |
          $z = "ffmpeg-$env:FFMPEG_VERSION-essentials_build.zip"
          Invoke-WebRequest "https://www.gyan.dev/ffmpeg/builds/packages/$z" -OutFile ffmpeg.zip
          Invoke-WebRequest "https://www.gyan.dev/ffmpeg/builds/packages/$z.sha256" -OutFile ffmpeg.zip.sha256
          $exp = (Get-Content ffmpeg.zip.sha256 -Raw).Trim().Split(' ')[0].ToLower()
          $got = (Get-FileHash ffmpeg.zip -Algorithm SHA256).Hash.ToLower()
          if ($exp -ne $got) { Write-Error "SHA-256 FFmpeg nepotrivit"; exit 1 }
          Expand-Archive ffmpeg.zip -DestinationPath ff
          $bin = (Get-ChildItem ff -Directory | Select-Object -First 1).FullName
          New-Item -ItemType Directory -Force tools | Out-Null
          Copy-Item "$bin\bin\ffmpeg.exe","$bin\bin\ffprobe.exe" tools\
          Copy-Item "$bin\LICENSE" tools\FFMPEG-LICENSE.txt
          Copy-Item "$bin\README.txt" tools\FFMPEG-README.txt
          Copy-Item windows\vendor\gdc-metadata-core.exe tools\
          $coreHash = (Get-FileHash tools\gdc-metadata-core.exe -Algorithm SHA256).Hash.ToLower()
          if (-not (Select-String -Path windows\vendor\PROVENANCE.txt -Pattern $coreHash -Quiet)) { Write-Error "gdc-metadata-core nu corespunde PROVENANCE.txt"; exit 1 }
          Copy-Item THIRD_PARTY_NOTICES.md tools\
          # ExifTool oficial (legătura oficială de pe exiftool.org → SourceForge), neschimbat, SHA-256 verificat; rulează ca proces separat
          Copy-Item "windows\vendor\exiftool-$($env:EXIFTOOL_VERSION)_64.zip" exiftool.zip
          if ((Get-FileHash exiftool.zip -Algorithm SHA256).Hash.ToLower() -ne $env:EXIFTOOL_SHA256) { Write-Error "SHA-256 ExifTool nepotrivit"; exit 1 }
          Expand-Archive exiftool.zip -DestinationPath et
          $etd = (Get-ChildItem et -Directory | Select-Object -First 1).FullName
          Copy-Item "$etd\exiftool(-k).exe" tools\exiftool.exe
          Copy-Item "$etd\exiftool_files" tools\exiftool_files -Recurse
          Copy-Item "$etd\exiftool_files\LICENSE" tools\EXIFTOOL-LICENSE-GPL3.txt
          Copy-Item "$etd\README.txt" tools\EXIFTOOL-README.txt

      - name: Publică aplicația (self-contained win-x64)
        shell: pwsh
        run: |
          dotnet publish windows\CGConvertor.Client\CGConvertor.Client.csproj -c Release -r win-x64 --self-contained true `
            -p:CGC_TOOLS_DIR="$env:GITHUB_WORKSPACE\tools" -p:Version=$env:APP_VERSION -o publish
          if (-not (Test-Path publish\CGConvertor.exe)) { Write-Error "Lipsește CGConvertor.exe"; exit 1 }

      - name: Semnează CGConvertor.exe (Authenticode, doar dacă există secretele)
        if: ${{ env.HAS_WIN_SELFSIGN == 'true' }}
        shell: pwsh
        env:
          WIN_SELFSIGN_PFX_BASE64: ${{ secrets.WIN_SELFSIGN_PFX_BASE64 }}
          WIN_SELFSIGN_PFX_PASSWORD: ${{ secrets.WIN_SELFSIGN_PFX_PASSWORD }}
        run: .\codesigning\sign-windows.ps1 -TargetPath "publish\CGConvertor.exe"

      - name: Compilează installerul (Inno Setup 6)
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /Qp "/DAppVersion=$env:APP_VERSION" "/DPublishDir=$env:GITHUB_WORKSPACE\publish" "/DOutDir=$env:GITHUB_WORKSPACE\out" windows\installer\CGConvertor.iss
          if (-not (Test-Path "out\CGConvertor-Windows-$env:APP_VERSION.exe")) { Write-Error "Installerul lipsește"; exit 1 }

      - name: Semnează installerul (Authenticode, doar dacă există secretele)
        if: ${{ env.HAS_WIN_SELFSIGN == 'true' }}
        shell: pwsh
        env:
          WIN_SELFSIGN_PFX_BASE64: ${{ secrets.WIN_SELFSIGN_PFX_BASE64 }}
          WIN_SELFSIGN_PFX_PASSWORD: ${{ secrets.WIN_SELFSIGN_PFX_PASSWORD }}
        run: .\codesigning\sign-windows.ps1 -TargetPath "out\CGConvertor-Windows-$env:APP_VERSION.exe"

      - name: Verifică semnătura și calculează SHA-256 (fără a expune secrete)
        shell: pwsh
        run: |
          $f = "out\CGConvertor-Windows-$env:APP_VERSION.exe"
          $sig = Get-AuthenticodeSignature $f
          "Authenticode: $($sig.Status) | Subject: $($sig.SignerCertificate.Subject)" | Tee-Object out\VERIFY.txt
          $h = (Get-FileHash $f -Algorithm SHA256).Hash.ToLower()
          "SHA256 $h  $(Split-Path $f -Leaf)" | Tee-Object -Append out\VERIFY.txt

      - name: Încarcă candidatul ca artefact (fără release)
        uses: actions/upload-artifact@v4
        with:
          name: CGConvertor-Windows-candidate-${{ env.APP_VERSION }}
          path: |
            out/CGConvertor-Windows-${{ env.APP_VERSION }}.exe
            out/VERIFY.txt
          retention-days: 14
